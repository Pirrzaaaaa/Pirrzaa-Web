<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>💕 Selamat Malam Sayang 💕</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sriracha&family=Varela+Round&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script>
  
  <style>
    /* ========== RESET & VARIABLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      color: #fff;
      overflow-x: hidden;
      font-family: 'Quicksand', sans-serif;
      background: #000;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }
    
    /* ========== BACKGROUND GRADIENT CANTIK ========== */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff6b88 0%, #ff8a9c 30%, #ff9eb5 70%, #ffb3c6 100%);
      opacity: 0.85;
      z-index: 0;
      animation: softGlow 8s infinite alternate;
    }
    
    @keyframes softGlow {
      0% { opacity: 0.8; }
      100% { opacity: 0.95; }
    }
    
    /* ========== LOADING SCREEN ========== */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ff758c, #ff7eb3);
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.8s ease;
    }
    
    .loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }
    
    .heart-loading {
      width: 60px;
      height: 60px;
      background: #fff;
      position: relative;
      transform: rotate(45deg);
      animation: heartbeat 1.2s infinite;
      margin-bottom: 20px;
      border-radius: 0 0 10px 0;
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
    }
    
    .heart-loading:before,
    .heart-loading:after {
      content: '';
      width: 60px;
      height: 60px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
    }
    
    .heart-loading:before { left: -30px; }
    .heart-loading:after { top: -30px; }
    
    .loading-text {
      color: white;
      font-size: 20px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      animation: blink 1.5s infinite;
      letter-spacing: 1px;
    }
    
    @keyframes heartbeat {
      0%, 100% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.15); }
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    /* ========== LANDSCAPE WARNING ========== */
    .landscape-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      padding: 20px;
    }
    
    .landscape-warning .icon { font-size: 70px; animation: rotate 2s infinite; margin-bottom: 20px; }
    .landscape-warning p { font-size: 22px; color: #ffb6c1; font-weight: 600; }
    
    @keyframes rotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      .landscape-warning { display: flex; }
    }
    
    /* ========== FOTO CEWEK UTAMA (ATAS) ========== */
    .foto-utama {
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 10px 30px rgba(255,105,180,0.7), 0 0 0 5px rgba(255,255,255,0.3);
      object-fit: cover;
      z-index: 100;
      background: white;
      padding: 4px;
      opacity: 1;
      transition: all 0.5s ease;
    }
    
    .foto-utama.hide {
      opacity: 0;
      transform: translateX(-50%) scale(0.8);
      pointer-events: none;
    }
    
    /* ========== POPUP FOTO PAS BUKA ENVELOPE ========== */
    .popup-foto {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 280px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(15px);
      border-radius: 40px 15px 40px 15px;
      border: 3px solid white;
      padding: 25px 20px 20px;
      z-index: 1000;
      text-align: center;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 5px rgba(255,255,255,0.3);
      opacity: 0;
    }
    
    .popup-foto.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    
    .popup-foto.hide {
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    
    .popup-foto img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 15px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(255,105,180,0.6);
    }
    
    .popup-foto h3 {
      color: white;
      font-size: 24px;
      font-family: 'Sriracha', cursive;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px #ff1493;
    }
    
    .popup-foto p {
      color: white;
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 15px;
    }
    
    .popup-foto button {
      background: #e91e63;
      border: 2px solid white;
      color: white;
      padding: 8px 25px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(233,30,99,0.5);
    }
    
    .popup-foto button:hover {
      transform: scale(1.05);
      background: #c2185b;
      box-shadow: 0 8px 25px #ff1493;
    }
    
    /* ========== KOTAK UTAMA ========== */
    .kotak {
      margin: 0 auto;
      margin-top: 80px;
      transform: scale(0);
      transition: all 0.5s ease;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 40px 15px 40px 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3), 0 0 0 2px rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.8);
      padding: 20px;
      text-align: center;
      max-width: 100%;
      width: 430px;
      min-height: 250px;
      position: relative;
      z-index: 10;
    }
    
    /* ========== ENVELOPE SUPER CUTE ========== */
    #envelope {
      margin: 0 auto;
      margin-top: 150px;
      position: relative;
      width: 220px;
      height: 140px;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      top: 120px;
      background: #e91e63;
      box-shadow: 0 15px 35px rgba(233,30,99,0.6), 0 0 0 3px rgba(255,255,255,0.5);
      animation: float 4s ease-in-out infinite;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    #envelope:hover {
      transform: scale(1.02);
      box-shadow: 0 20px 45px #ff1493;
    }
    
    .front { position: absolute; width: 0; height: 0; z-index: 3; }
    .flap {
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-bottom: 70px solid transparent;
      border-top: 70px solid #e91e63;
      transform-origin: top;
    }
    .pocket {
      border-left: 110px solid #fce4ec;
      border-right: 110px solid #fce4ec;
      border-bottom: 70px solid #f8bbd0;
      border-top: 70px solid transparent;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }
    
    .letter {
      position: relative;
      background: #fffaf0;
      width: 88%;
      margin: 0 auto;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 5px 30px rgba(233,30,99,0.5);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .message {
      font-family: 'Sriracha', cursive;
      color: #c2185b;
      text-align: center;
      font-size: 1.5em;
      text-shadow: 0 2px 5px rgba(255,255,255,0.5);
    }
    
    .envlope-wrapper { height: 260px; position: relative; z-index: 50; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    
    .open .flap { transform: rotateX(180deg); transition: transform 0.6s; z-index: 1; }
    .close .flap { transform: rotateX(0deg); transition: transform 0.6s; z-index: 5; }
    .open .letter { transform: translateY(-55px) rotate(-2deg) scale(1.03); transition: transform 0.6s; z-index: 2; }
    .close .letter { transform: translateY(0); transition: transform 0.4s; }
    
    .envelope-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      font-size: 2.5rem;
      z-index: 6;
      animation: pulseHeart 2s infinite;
      filter: drop-shadow(0 0 15px hotpink);
      text-shadow: 0 0 20px white;
    }
    
    @keyframes pulseHeart {
      0%, 100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-50%) scale(1.2); }
    }
    
    /* ========== TOMBOL ========== */
    .reset, .tombol {
      text-align: center;
      margin-top: 20px;
      z-index: 50;
    }
    
    .reset button, .tombol button {
      font-family: 'Varela Round', sans-serif;
      font-weight: 700;
      transition: all 0.3s ease;
      background: linear-gradient(45deg, #e91e63, #ff1493);
      border: 2px solid white;
      border-radius: 50px;
      color: white;
      padding: 12px 30px;
      font-size: 16px;
      box-shadow: 0 10px 25px rgba(233,30,99,0.6);
      cursor: pointer;
      letter-spacing: 1px;
    }
    
    .reset button:hover, .tombol button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 35px #ff1493;
    }
    
    .tombol {
      transform: scale(0);
      opacity: 0;
      transition: all 0.5s ease;
    }
    
    /* ========== STIKER CUTE ========== */
    .stiker {
      display: flex;
      justify-content: center;
      margin: 15px auto;
      transform: scale(0);
      transition: all 0.5s ease;
    }
    
    .stiker img {
      width: 100px;
      height: 100px;
      border: 4px solid white;
      border-radius: 50%;
      padding: 4px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 10px 30px rgba(255,105,180,0.6);
      animation: gentleWobble 3s infinite;
    }
    
    @keyframes gentleWobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      75% { transform: rotate(-5deg); }
    }
    
    /* ========== CONTAINER PESAN ========== */
    #containerPesan {
      padding: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 30px 30px 30px 5px;
      margin: 15px 0;
      border: 2px dashed rgba(255,255,255,0.6);
      max-height: 260px;
      overflow: auto;
      scrollbar-width: none;
      text-align: left;
      backdrop-filter: blur(5px);
    }
    
    #containerPesan::before {
      content: '💌';
      position: absolute;
      top: -15px;
      left: 20px;
      font-size: 24px;
      background: rgba(255,255,255,0.3);
      padding: 5px 15px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      border: 2px solid white;
    }
    
    #teksCinta, #pesanAkhir, #teksLucu {
      font-size: 14.5px;
      line-height: 1.8;
      color: white;
      font-weight: 500;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }
    
    /* ========== HARI SPESIAL ========== */
    .hari-spesial {
      background: rgba(255,255,255,0.2);
      padding: 8px 18px;
      border-radius: 50px;
      margin: 10px auto;
      font-size: 15px;
      border: 2px solid white;
      display: inline-block;
      font-weight: 600;
      backdrop-filter: blur(5px);
      box-shadow: 0 5px 15px rgba(255,105,180,0.4);
    }
    
    /* ========== FINAL GREETING ========== */
    #finalGreeting {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%,-40%) scale(0);
      opacity: 0;
      font-family: 'Sriracha', cursive;
      font-size: 3rem;
      color: white;
      text-align: center;
      z-index: 200;
      pointer-events: none;
      width: 100%;
      text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
      white-space: nowrap;
    }
    
    #finalGreeting.show { animation: greetingAppear 1.2s ease forwards; }
    #finalGreeting.hide { animation: greetingDisappear 1.2s ease forwards; }
    
    @keyframes greetingAppear {
      0% { transform: translate(-50%,-40%) scale(0); opacity: 0; }
      60% { transform: translate(-50%,-40%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%,-40%) scale(1); opacity: 1; }
    }
    
    @keyframes greetingDisappear {
      0% { transform: translate(-50%,-40%) scale(1); opacity: 1; }
      100% { transform: translate(-50%,-40%) scale(0); opacity: 0; }
    }
    
    #finalGreeting span {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px);
      animation: letterFloat 1.2s ease forwards;
    }
    
    @keyframes letterFloat {
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ========== HATI JATUH ========== */
    .hati {
      position: fixed;
      font-size: 24px;
      animation: jatuh 4s linear forwards;
      z-index: 50;
      pointer-events: none;
      filter: drop-shadow(0 0 10px hotpink);
    }
    
    @keyframes jatuh {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    
    /* ========== SEMBUNYI ========== */
    .sembunyi, #linkmp3 { display: none !important; }
    
    /* ========== RESPONSIVE ========== */
    @media (max-width: 600px) {
      .kotak { width: 92%; padding: 18px; margin-top: 70px; }
      #envelope { width: 190px; height: 120px; top: 100px; }
      .flap, .pocket { border-left-width: 95px; border-right-width: 95px; border-bottom-width: 60px; border-top-width: 60px; }
      .envelope-heart { font-size: 2.2rem; }
      .foto-utama { width: 100px; height: 100px; top: 10%; }
      .popup-foto { width: 260px; }
      .popup-foto img { width: 120px; height: 120px; }
      #finalGreeting { font-size: 2.2rem; white-space: normal; width: 95%; }
      .tombol button { padding: 10px 25px; }
    }
    
    @media (max-width: 360px) {
      .foto-utama { width: 85px; height: 85px; }
      #finalGreeting { font-size: 1.8rem; }
      .popup-foto { width: 240px; }
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loadingScreen">
  <div class="heart-loading"></div>
  <div class="loading-text">Loading buat kamu sayang...</div>
</div>

<!-- LANDSCAPE WARNING -->
<div class="landscape-warning">
  <div class="icon">📱</div>
  <p>Putar HP ke mode portrait ya 🤍</p>
</div>

<!-- BACKGROUND -->
<div class="background-overlay"></div>

<!-- AUDIO -->
<audio src="https://feeldreams.github.io/audio/wedont.mp3" id="linkmp3" loop></audio>

<!-- FOTO CEWEK UTAMA (ATAS) -->
<img class="foto-utama" id="fotoUtama" src="https://cdn.yupra.my.id/yp/euxj94p6.jpg" alt="Foto Cewek">

<!-- POPUP FOTO (MUNCUL PAS BUKA ENVELOPE) -->
<div class="popup-foto" id="popupFoto">
  <img id="popupFotoImg" src="https://cdn.yupra.my.id/yp/6bud5z2a.jpg" alt="Foto Cewek">
  <h3>Hai Sayang! 💕</h3>
  <p>Ini buat kamu yang spesial</p>
  <button onclick="tutupPopup()">💗 Lanjut</button>
</div>

<!-- FINAL GREETING -->
<div id="finalGreeting">Good Night Sayangku ❤❤</div>

<!-- HALAMAN 1: ENVELOPE -->
<div id="hal1">
  <div class="envlope-wrapper">
    <div id="envelope" class="close" onclick="bukaEnvelope()">
      <div class="front flap"></div>
      <div class="front pocket"></div>
      <div class="envelope-heart">💖</div>
      <div class="letter">
        <div class="message">
          <p>For You 💌</p>
        </div>
      </div>
    </div>
  </div>
  <div class="reset">
    <button onclick="bukaEnvelope()">💭 Buka Pesan</button>
  </div>
</div>

<!-- HALAMAN 2: KOSONG -->
<div id="hal2" class="kotak sembunyi"></div>

<!-- HALAMAN 3: PESAN AKHIR -->
<div id="hal3" class="kotak sembunyi">
  <!-- Hari Spesial -->
  <div class="hari-spesial" id="hariSpesial"></div>
  
  <!-- Stiker -->
  <div id="stiker3" class="stiker">
    <img id="stikerUtama" src="https://htmlku.com/0/panda/ciumin.gif" />
  </div>
  
  <!-- Container Pesan -->
  <div id="containerPesan">
    <p id="teksCinta"></p>
    <p id="pesanAkhir"></p>
    <p id="teksLucu"></p>
  </div>
</div>

<!-- TOMBOL ACTION -->
<div class="tombol">
  <button onclick="balasWa()">💌 Balas</button>
</div>

<script>
  // ========== DATA PESAN ==========
  const txtDoa = "Selamat malam dan selamat lepas lelah sayang 🫶🏻💞 Aku bener-bener beruntung punya kamu, aku suka semua tentang kamu—perhatianmu, suaramu, caramu peduli sama aku. Kamu ga perlu ragu lagi sama aku karena aku sayang banget sama kamu dan kamu selalu jadi orang yang aku butuhin setiap hari 💞";
  const txtPesanAkhir = "Maafin aku ya kalau aku sering bikin salah dan belum selalu bisa ngertiin kamu. Aku takut kehilangan kamu dan ga mau kamu pergi atau menjauh dari aku. Semua ini karena aku sesayang itu sama kamu 🥺💗";
  const txtLucu = "── ᯓᡣ𐭩<br>Makasih udah selalu ada dan bikin aku bahagia. Jangan pernah ngerasa sendirian, ada aku di sini buat kamu. Good night, sweet dreams—I love you everything about you 💖";

  // ========== ELEMEN ==========
  const audio = document.getElementById('linkmp3');
  let intervalHati;
  let audioPlayed = false;
  let popupVisible = false;

  // ========== HITUNG HARI ==========
  function hitungHari() {
    const firstDate = new Date('2025-12-17'); // GANTI TANGGAL JADIAN
    const today = new Date();
    const diffTime = Math.abs(today - firstDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('hariSpesial').innerHTML = `❤️ I Lovee Youu Sayanggggg ❤️`;
  }

  // ========== HATI JATUH ==========
  function hatiJatuh() {
    const emojis = ['❤️', '💖', '💕', '💗', '💓', '✨', '🌸', '💞', '🩷'];
    const hati = document.createElement('div');
    hati.className = 'hati';
    hati.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
    hati.style.left = Math.random() * 100 + 'vw';
    hati.style.animationDuration = (Math.random() * 2 + 3.5) + 's';
    hati.style.fontSize = (Math.random() * 15 + 20) + 'px';
    document.body.appendChild(hati);
    setTimeout(() => hati.remove(), 5000);
  }

  // ========== TUTUP POPUP ==========
  function tutupPopup() {
    const popup = document.getElementById('popupFoto');
    popup.classList.remove('show');
    popup.classList.add('hide');
    popupVisible = false;
    
    // Lanjut ke animasi greeting
    setTimeout(() => {
      // Sembunyikan foto utama
      document.getElementById('fotoUtama').classList.add('hide');
      
      // Tampilkan greeting
      const greeting = document.getElementById('finalGreeting');
      greeting.classList.add('show');
      
      const text = greeting.textContent;
      greeting.innerHTML = '';
      text.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.animationDelay = `${i * 0.03}s`;
        greeting.appendChild(span);
      });

      setTimeout(() => {
        greeting.classList.remove('show');
        greeting.classList.add('hide');
        
        setTimeout(() => {
          pindahHal(3);
        }, 800);
      }, 2000);
    }, 300);
  }

  // ========== BUKA ENVELOPE ==========
  function bukaEnvelope() {
    if (popupVisible) return;
    
    // Play audio sekali
    if (!audioPlayed) {
      audio.play().catch(e => console.log('Autoplay failed'));
      audioPlayed = true;
    }
    
    const envelope = document.getElementById('envelope');
    envelope.classList.remove('close');
    envelope.classList.add('open');
    document.querySelector(".reset").style = "transform:scale(0);opacity:0;";
    
    setTimeout(() => {
      document.querySelector("#envelope").style = "transform:scale(0);opacity:0;";
      
      setTimeout(() => {
        // Tampilkan popup foto
        const popup = document.getElementById('popupFoto');
        popup.classList.remove('hide');
        popup.classList.add('show');
        popupVisible = true;
      }, 300);
    }, 1200);
  }

  // ========== PINDAH HALAMAN ==========
  function pindahHal(hal) {
    for (let i = 1; i <= 3; i++) {
      document.getElementById(`hal${i}`).classList.add('sembunyi');
    }
    document.getElementById(`hal${hal}`).classList.remove('sembunyi');
    
    if (hal === 3) {
      document.getElementById('hal3').style = "width:92%; padding:20px; margin-top:70px; transform:scale(1);";
      hitungHari();
      mulaiHal3();
    }
  }

  // ========== MULAI HALAMAN 3 ==========
  function mulaiHal3() {
    document.getElementById('stiker3').style = "transform:scale(1)";
    
    // Mulai hati jatuh setiap 350ms
    intervalHati = setInterval(hatiJatuh, 350);

    new TypeIt("#teksCinta", {
      strings: txtDoa,
      speed: 20,
      startDelay: 400,
      afterComplete: function() {
        document.querySelector("#teksCinta .ti-cursor").style.display = "none";
        new TypeIt("#pesanAkhir", {
          strings: txtPesanAkhir,
          speed: 20,
          afterComplete: function() {
            document.querySelector("#pesanAkhir .ti-cursor").style.display = "none";
            new TypeIt("#teksLucu", {
              strings: txtLucu,
              speed: 20,
              afterComplete: function() {
                document.querySelector("#teksLucu .ti-cursor").style.display = "none";
                document.querySelector(".tombol").style = "transform:scale(1);opacity:1;";
              }
            }).go();
          }
        }).go();
      }
    }).go();
  }

  // ========== AUTO SCROLL ==========
  setInterval(() => {
    const container = document.getElementById("containerPesan");
    if (container && container.scrollTop < container.scrollHeight - container.clientHeight) {
      container.scrollTop += 8;
    }
  }, 50);

  // ========== BALAS WA ==========
  function balasWa() {
    window.open(`https://wa.me/?text=${encodeURIComponent("Night too sayangg 💕")}`, '_blank');
  }

  // ========== WINDOW ONLOAD ==========
  window.addEventListener('load', function() {
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('hide');
    }, 1500);
    
    document.getElementById('hal1').classList.remove('sembunyi');
    
    // Title lucu berganti
    const titles = ['💕 Untuk Kamu 💕', '🌙 Good Night', '🫶🏻 Sayang', '💤 Sweet Dreams'];
    let i = 0;
    setInterval(() => {
      document.title = titles[i % titles.length];
      i++;
    }, 2000);
  });
</script>

</body>
